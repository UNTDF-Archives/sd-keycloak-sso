# nginx de las webs estaticas. Igual al default, pero con cabeceras grandes: las cookies de sesion
# de los tres proxies (mismo host, distinto puerto) viajan juntas y superan los 8 KB por defecto.
# Y sin cache: si no, tras cerrar sesion el navegador mostraba la pagina vieja sin consultar al proxy.
server {
    listen 80;
    large_client_header_buffers 4 32k;
    add_header Cache-Control "no-store" always;   # el navegador no sirve la pagina desde cache: siempre pasa por el proxy (login)
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
